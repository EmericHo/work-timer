[build]
  command = "npm install --legacy-peer-deps && npm run build"

[build.environment]
  # Omit public environment variables from secrets scanning
  # NEXT_PUBLIC_* variables are intentionally public and embedded in client bundles
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_GA_MEASUREMENT_ID"
  # Ensure npm uses legacy peer deps for React 19 compatibility
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"
